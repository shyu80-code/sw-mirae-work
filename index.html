<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW미래채움 교육 운영 및 차시 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <header class="mb-6 border-b pb-4 flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">SW미래채움 교육 운영 결과 관리</h1>
                <p class="text-sm text-gray-500 mt-1">주·보조 강사 현황 및 차시별 교육 결과 데이터 관리 시스템</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition shadow">
                + 교육일지 등록
            </button>
        </header>

        <!-- 데이터 테이블 영역 -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 border text-sm">
                <thead class="bg-gray-100 text-gray-700 font-semibold">
                    <tr>
                        <th class="px-3 py-3 text-center">순번</th>
                        <th class="px-3 py-3 text-center">교육일자</th>
                        <th class="px-3 py-3 text-center">주강사</th>
                        <th class="px-3 py-3 text-center">보조강사</th>
                        <th class="px-3 py-3 text-left">교육과정명</th>
                        <th class="px-3 py-3 text-center">차시</th>
                        <th class="px-3 py-3 text-left">교육기관명</th>
                        <th class="px-3 py-3 text-center">인원</th>
                        <th class="px-3 py-3 text-center">만족도</th>
                        <th class="px-3 py-3 text-center">수정일시</th>
                        <th class="px-3 py-3 text-center">관리</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody" class="divide-y divide-gray-200 text-gray-600">
                    <!-- 데이터가 동적으로 입력됩니다 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 등록/수정 모달 -->
    <div id="eduModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl relative">
            <h2 id="modalTitle" class="text-xl font-bold text-gray-800 mb-4">교육일지 등록</h2>
            <form id="eduForm" onsubmit="saveData(event)" class="space-y-4">
                <input type="hidden" id="editIndex" value="">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">교육일자</label>
                        <input type="date" id="eduDate" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">차시</label>
                        <input type="text" id="eduSession" placeholder="예: 1차시" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">주강사명</label>
                        <input type="text" id="mainInstructor" placeholder="주강사 성함" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">보조강사명</label>
                        <input type="text" id="subInstructor" placeholder="보조강사 성함" value="유소향" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">교육과정명</label>
                    <input type="text" id="courseName" placeholder="과정명 입력" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">교육기관명</label>
                        <input type="text" id="schoolName" placeholder="학교/기관명" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">참석인원</label>
                        <input type="number" id="attendees" placeholder="0" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">만족도점수</label>
                        <input type="number" step="0.1" id="satisfaction" placeholder="4.8" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">비고</label>
                    <input type="text" id="remarks" placeholder="특이사항 입력" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition">취소</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 자바스크립트 로직 -->
    <script>
        // 초기 샘플 데이터 (로컬스토리지에 데이터가 없을 경우 세팅)
        let eduData = JSON.parse(localStorage.getItem('sw_edu_data')) || [
            { id: 1, date: "2026-09-01", main: "김강사", sub: "유소향", course: "SW 미래채움 코딩 기초", session: "1차시", school: "전주초등학교", count: 25, score: 4.8, updated: "2026-09-01 18:00", remarks: "정상 종료" },
            { id: 2, date: "2026-09-02", main: "이강사", sub: "유소향", course: "AI 로봇 활용 수업", session: "2차시", school: "전주중학교", count: 20, score: 4.9, updated: "2026-09-02 17:30", remarks: "기자재 양호" }
        ];

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';
            
            if(eduData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="text-center py-6 text-gray-400">등록된 데이터가 없습니다.</td></tr>`;
                return;
            }

            eduData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="px-3 py-3 text-center">${index + 1}</td>
                    <td class="px-3 py-3 text-center">${item.date}</td>
                    <td class="px-3 py-3 text-center font-medium text-gray-800">${item.main}</td>
                    <td class="px-3 py-3 text-center">${item.sub}</td>
                    <td class="px-3 py-3 text-left">${item.course}</td>
                    <td class="px-3 py-3 text-center"><span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-xs font-semibold">${item.session}</span></td>
                    <td class="px-3 py-3 text-left">${item.school}</td>
                    <td class="px-3 py-3 text-center">${item.count}명</td>
                    <td class="px-3 py-3 text-center">${item.score}</td>
                    <td class="px-3 py-3 text-center text-xs text-gray-400">${item.updated}</td>
                    <td class="px-3 py-3 text-center space-x-1">
                        <button onclick="editData(${index})" class="bg-emerald-500 hover:bg-emerald-600 text-white px-2 py-1 rounded text-xs">수정</button>
                        <button onclick="deleteData(${index})" class="bg-rose-500 hover:bg-rose-600 text-white px-2 py-1 rounded text-xs">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            localStorage.setItem('sw_edu_data', JSON.stringify(eduData));
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = "교육일지 등록";
            document.getElementById('editIndex').value = "";
            document.getElementById('eduForm').reset();
            document.getElementById('subInstructor').value = "유소향";
            document.getElementById('eduModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('eduModal').classList.add('hidden');
        }

        function saveData(event) {
            event.preventDefault();
            const editIndex = document.getElementById('editIndex').value;
            const now = new Date();
            const timestamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const newData = {
                id: editIndex === "" ? Date.now() : eduData[editIndex].id,
                date: document.getElementById('eduDate').value,
                main: document.getElementById('mainInstructor').value,
                sub: document.getElementById('subInstructor').value,
                course: document.getElementById('courseName').value,
                session: document.getElementById('eduSession').value,
                school: document.getElementById('schoolName').value,
                count: parseInt(document.getElementById('attendees').value),
                score: parseFloat(document.getElementById('satisfaction').value),
                updated: timestamp,
                remarks: document.getElementById('remarks').value
            };

            if (editIndex === "") {
                eduData.push(newData);
            } else {
                eduData[editIndex] = newData;
            }

            closeModal();
            renderTable();
        }

        function editData(index) {
            const item = eduData[index];
            document.getElementById('modalTitle').innerText = "교육일지 수정";
            document.getElementById('editIndex').value = index;
            document.getElementById('eduDate').value = item.date;
            document.getElementById('eduSession').value = item.session;
            document.getElementById('mainInstructor').value = item.main;
            document.getElementById('subInstructor').value = item.sub;
            document.getElementById('courseName').value = item.course;
            document.getElementById('schoolName').value = item.school;
            document.getElementById('attendees').value = item.count;
            document.getElementById('satisfaction').value = item.score;
            document.getElementById('remarks').value = item.remarks;
            
            document.getElementById('eduModal').classList.remove('hidden');
        }

        function deleteData(index) {
            if(confirm("정말 삭제하시겠습니까?")) {
                eduData.splice(index, 1);
                renderTable();
            }
        }

        // 페이지 로드 시 테이블 렌더링
        window.onload = renderTable;
    </script>
</body>
</html>
