<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW미래채움 전북센터 강사 실적 관리</title>
    <!-- 엑셀 파일 읽기 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --header-bg: #1e3a8a;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }
        
        .header-banner {
            background-color: var(--header-bg);
            color: white;
            padding: 30px 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-badge {
            background: white;
            color: var(--header-bg);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .header-title h1 {
            margin: 0 0 10px 0;
            font-size: 1.8em;
            font-weight: 700;
        }
        .header-title p {
            margin: 0;
            color: #93c5fd;
            font-size: 0.95em;
        }

        .container {
            max-width: 1100px;
            margin: -30px auto 40px auto;
            padding: 0 20px;
        }

        .search-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }
        .search-form-grid {
            display: grid;
            grid-template-columns: 200px 1fr auto;
            gap: 15px;
            align-items: flex-end;
        }
        @media (max-width: 768px) {
            .search-form-grid { grid-template-columns: 1fr; }
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #475569;
        }
        input, select {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1em;
            background-color: #fff;
            color: var(--text-color);
            outline: none;
        }
        input:focus, select:focus {
            border-color: var(--primary);
        }
        .btn-search {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            height: 48px;
        }
        .btn-search:hover { background-color: var(--primary-hover); }

        .notice-bar {
            background-color: #fef9c3;
            border: 1px solid #fde047;
            color: #854d0e;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9em;
            margin-top: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            flex-wrap: wrap;
            gap: 10px;
        }
        .toolbar-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .file-upload-label {
            background-color: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: opacity 0.2s;
            display: inline-block;
        }
        .file-upload-label.import { background-color: #6366f1; }
        .file-upload-label:hover { opacity: 0.9; }

        .summary-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        .summary-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }
        .summary-box span { font-size: 1.4em; display: block; margin-top: 5px; color: var(--primary); }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95em; }
        th, td { border: 1px solid #e2e8f0; padding: 12px 10px; text-align: center; }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; }
        td { background-color: #fff; }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .badge-school { background-color: #e0f2fe; color: #0284c7; }
        .badge-center { background-color: #f3e8ff; color: #9333ea; }
        .badge-etc { background-color: #f1f5f9; color: #475569; }

        .del-btn {
            background-color: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
        }
        .del-btn:hover { background-color: #ef4444; color: white; }

        .footer-btns {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-secondary {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }
        .btn-secondary:hover { opacity: 0.9; }
        .btn-danger { background-color: #dc2626; }
    </style>
</head>
<body>

    <div class="header-banner">
        <div class="header-top">
            <div class="logo-area">
                <span class="logo-badge">SW미래채움</span>
            </div>
        </div>
        <div class="header-title">
            <h1>SW미래채움 전북센터 강사 실적 조회</h1>
            <p>조회월과 SW미래채움 ID(학교명 등)를 입력하면 사업 수행 교육실시 결과와 스케줄을 영구적으로 관리할 수 있습니다.</p>
        </div>
    </div>

    <div class="container">
        
        <div class="search-card">
            <div class="search-form-grid">
                <div class="form-group">
                    <label for="searchMonth">조회월</label>
                    <input type="month" id="searchMonth">
                </div>
                <div class="form-group">
                    <label for="searchKeyword">검색 키워드 (학교명 또는 과정명)</label>
                    <input type="text" id="searchKeyword" placeholder="예: 부귀초 또는 코딩드론">
                </div>
                <button class="btn-search" onclick="filterByKeyword()">조회</button>
            </div>
            <div class="notice-bar">
                데이터는 브라우저에 자동 저장되며, 상단의 '스케줄 파일 저장(백업)' 버튼으로 파일로 보관할 수 있습니다.
            </div>
        </div>

        <!-- 엑셀 및 스케줄 파일 관리 툴바 -->
        <div class="toolbar">
            <div style="font-weight: 600; color: #334155;">스케줄 파일 및 엑셀 연동 관리</div>
            <div class="toolbar-group">
                <label for="importFile" class="file-upload-label import">스케줄 불러오기</label>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importSchedule(event)">

                <label for="excelFile" class="file-upload-label">엑셀 시간표 추가</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleExcelUpload(event)">
            </div>
        </div>

        <div class="summary-container">
            <div class="summary-box">총 조회 근무 일수<span id="totalDays">0일</span></div>
            <div class="summary-box">총 인정 근무 시간<span id="totalHours">0시간</span></div>
        </div>

        <div class="search-card" style="margin-bottom: 25px;">
            <h3 style="margin-top: 0; color: var(--header-bg); font-size: 1.1em; margin-bottom: 15px;">+ 근무 및 실적 직접 등록하기</h3>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px;">
                <div class="form-group">
                    <label for="workDate">근무 일자</label>
                    <input type="date" id="workDate">
                </div>
                <div class="form-group">
                    <label for="workType">근무 구분</label>
                    <select id="workType">
                        <option value="학교출강">학교출강</option>
                        <option value="센터근무">센터근무/연구</option>
                        <option value="행사/기타">행사/기타</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label for="workPlace">근무 장소 / 학교명</label>
                    <input type="text" id="workPlace" placeholder="예: 부귀초등학교">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: flex-end;">
                <div class="form-group">
                    <label for="startTime">시작 시간</label>
                    <input type="time" id="startTime" value="13:10">
                </div>
                <div class="form-group">
                    <label for="endTime">퇴근 시간</label>
                    <input type="time" id="endTime" value="14:30">
                </div>
                <div class="form-group">
                    <label for="workDesc">상세 교육 내용</label>
                    <input type="text" id="workDesc" placeholder="예: AI 코딩드론 수업">
                </div>
                <button class="btn-search" style="height: 48px;" onclick="addRecord()">등록</button>
            </div>
        </div>

        <div class="table-card">
            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.2em; color: #334155;">교육실시 결과 내역</h3>
            <div class="table-wrapper">
                <table id="workTable">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>구분</th>
                            <th>장소 / 학교명</th>
                            <th>근무 시간</th>
                            <th>상세 내용</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="recordList"></tbody>
                </table>
            </div>

            <div class="footer-btns">
                <button class="btn-secondary" onclick="exportSchedule()" style="background-color: #2563eb;">스케줄 파일 저장(백업)</button>
                <button class="btn-secondary btn-danger" onclick="clearData()">전체 초기화</button>
            </div>
        </div>

    </div>

<script>
    let records = JSON.parse(localStorage.getItem('sw_mirae_persistent_records')) || [];
    let currentFilter = '';
    let selectedMonth = '';

    document.getElementById('workDate').valueAsDate = new Date();
    const now = new Date();
    document.getElementById('searchMonth').value = now.toISOString().slice(0, 7);
    selectedMonth = now.toISOString().slice(0, 7);

    function saveToStorage() {
        localStorage.setItem('sw_mirae_persistent_records', JSON.stringify(records));
    }

    function renderTable() {
        const tbody = document.getElementById('recordList');
        tbody.innerHTML = '';
        let totalH = 0;
        let visibleCount = 0;
        
        records.sort((a, b) => new Date(a.date) - new Date(b.date));

        records.forEach((rec, index) => {
            if (selectedMonth && !rec.date.startsWith(selectedMonth)) {
                return;
            }

            if (currentFilter && !rec.place.includes(currentFilter) && !rec.desc.includes(currentFilter)) {
                return;
            }

            totalH += parseFloat(rec.hours);
            visibleCount++;

            let badgeClass = rec.type === '학교출강' ? 'badge-school' : (rec.type === '센터근무' ? 'badge-center' : 'badge-etc');

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${rec.date}</td>
                <td><span class="badge ${badgeClass}">${rec.type}</span></td>
                <td><b>${rec.place || '-'}</b></td>
                <td>${rec.start} ~ ${rec.end}</td>
                <td style="text-align: left; padding-left: 12px;">${rec.desc}</td>
                <td><button class="del-btn" onclick="deleteRecord(${index})">삭제</button></td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('totalDays').innerText = visibleCount + '일';
        document.getElementById('totalHours').innerText = Math.round(totalH * 10) / 10 + '시간';
        
        saveToStorage();
    }

    function filterByKeyword() {
        selectedMonth = document.getElementById('searchMonth').value;
        currentFilter = document.getElementById('searchKeyword').value.trim();
        renderTable();
    }

    function timeToMinutes(timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
    }

    function addRecord() {
        const date = document.getElementById('workDate').value;
        const type = document.getElementById('workType').value;
        const place = document.getElementById('workPlace').value;
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;
        const desc = document.getElementById('workDesc').value;

        if (!date || !place || !startTime || !endTime) {
            alert('날짜, 장소, 시작 및 퇴근 시간은 필수 입력입니다.');
            return;
        }

        const startMin = timeToMinutes(startTime);
        const endMin = timeToMinutes(endTime);
        let diffMinutes = endMin - startMin;
        
        if (diffMinutes <= 0) {
            alert('퇴근 시간은 시작 시간보다 이후여야 합니다.');
            return;
        }

        const newStart = startMin;
        const newEnd = endMin;

        for (let rec of records) {
            if (rec.date === date) {
                if (!rec.start || !rec.end) continue;
                
                const existingStart = timeToMinutes(rec.start);
                const existingEnd = timeToMinutes(rec.end);

                if (newStart < existingEnd && newEnd > existingStart) {
                    alert(`[중복 경고] ${date} 일자에 이미 겹치는 시간대 (${rec.start} ~ ${rec.end}, 장소: ${rec.place})의 근무 기록이 존재합니다! 시간을 확인해주세요.`);
                    return;
                }
            }
        }

        let hours = Math.round((diffMinutes / 60) * 10) / 10;

        records.push({ 
            date, 
            type, 
            start: startTime,
            end: endTime,
            hours: hours, 
            place: place.trim(), 
            desc: desc.trim() || '-'
        });

        document.getElementById('workPlace').value = '';
        document.getElementById('workDesc').value = '';
        
        renderTable();
        alert('근무 실적이 정상 등록되었습니다.');
    }

    function deleteRecord(index) {
        if (confirm('이 기록을 삭제하시겠습니까?')) {
            records.splice(index, 1);
            renderTable();
        }
    }

    function clearData() {
        if (confirm('저장된 모든 기록을 초기화하시겠습니까?')) {
            records = [];
            currentFilter = '';
            renderTable();
        }
    }

    // 스케줄 백업 파일 저장 (다운로드)
    function exportSchedule() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "sw_mirae_schedule_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // 백업해둔 스케줄 파일 불러오기 (복원 및 추가)
    function importSchedule(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    let addedCount = 0;
                    importedData.forEach(item => {
                        let exists = records.some(r => r.date === item.date && r.start === item.start && r.place === item.place);
                        if (!exists) {
                            records.push(item);
                            addedCount++;
                        }
                    });
                    renderTable();
                    alert(`스케줄 파일에서 총 ${addedCount}건의 기록을 성공적으로 불러왔습니다!`);
                } else {
                    alert('올바른 스케줄 백업 파일 형식이 아닙니다.');
                }
                event.target.value = '';
            } catch (err) {
                alert('파일을 읽는 중 오류가 발생했습니다.');
                console.error(err);
            }
        };
        reader.readAsText(file);
    }

    function excelDateToISO(serial) {
        if (!serial) return '';
        if (typeof serial === 'string' && serial.includes('-')) return serial.trim().split(' ')[0];
        const utc_days = Math.floor(serial - 25569);
        const utc_value = utc_days * 86400;
        const date_info = new Date(utc_value * 1000);
        if (isNaN(date_info.getTime())) return '';
        const year = date_info.getFullYear();
        const month = String(date_info.getMonth() + 1).padStart(2, '0');
        const day = String(date_info.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function handleExcelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                let schoolName = '진안 부귀초등학교';
                let courseName = 'AI 코딩드론';
                let addedCount = 0;

                jsonRows.forEach(row => {
                    let rowStr = row.join(' ');
                    if (rowStr.includes('학교')) {
                        let match = rowStr.match(/([가-힣\s]+초등학교|[가-힣\s]+초)/);
                        if (match) schoolName = match[0].trim();
                    }
                    if (rowStr.includes('과정명') || rowStr.includes('코딩드론')) {
                        if (rowStr.includes('AI')) courseName = 'AI 코딩드론';
                    }
                });

                jsonRows.forEach(row => {
                    let dateVal = null;
                    let timeVal = '13:10~14:30';

                    row.forEach(cell => {
                        if (typeof cell === 'number' && cell > 45000) {
                            dateVal = excelDateToISO(cell);
                        } else if (typeof cell === 'string' && cell.match(/\d{4}-\d{2}-\d{2}/)) {
                            dateVal = cell.trim().split(' ')[0];
                        }
                        
                        if (typeof cell === 'string' && cell.includes('~') && cell.includes(':')) {
                            timeVal = cell.trim();
                        }
                    });

                    if (dateVal) {
                        let startTime = '13:10';
                        let endTime = '14:30';
                        let hours = 1.3;

                        if (timeVal.includes('~')) {
                            let parts = timeVal.split('~');
                            startTime = parts[0].trim();
                            endTime = parts[1].trim();

                            const [sH, sM] = startTime.split(':').map(Number);
                            const [eH, eM] = endTime.split(':').map(Number);
                            let diff = (eH * 60 + eM) - (sH * 60 + sM);
                            if (diff > 0) hours = Math.round((diff / 60) * 10) / 10;
                        }

                        let exists = records.some(r => r.date === dateVal && r.start === startTime && r.place === schoolName);
                        if (!exists) {
                            records.push({
                                date: dateVal,
                                type: '학교출강',
                                start: startTime,
                                end: endTime,
                                hours: hours,
                                place: schoolName,
                                desc: courseName + ' 교육실시'
                            });
                            addedCount++;
                        }
                    }
                });

                renderTable();
                alert(`[${schoolName}] 엑셀 시간표에서 새로운 실적 데이터 총 ${addedCount}건을 추가로 반영했습니다!`);
                event.target.value = '';
            } catch (err) {
                alert('엑셀 파일을 읽는 중 오류가 발생했습니다.');
                console.error(err);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    renderTable();
</script>

</body>
</html>
