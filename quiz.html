<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW미래채움 강사 실기예상문제</title>
    <style>
        :root {
            --header-bg: #1e3a8a;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --ok: #16a34a;
            --ok-bg: #dcfce7;
            --ng: #dc2626;
            --ng-bg: #fee2e2;
        }
        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            line-height: 1.6;
        }
        .header-banner {
            background-color: var(--header-bg);
            color: white;
            padding: 30px 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-badge { background: white; color: var(--header-bg); padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.9em; }
        .back-link { color: #93c5fd; text-decoration: none; font-size: 0.9em; }
        .back-link:hover { text-decoration: underline; }
        .header-title h1 { margin: 0 0 10px 0; font-size: 1.8em; }
        .header-title p { margin: 0; color: #93c5fd; font-size: 0.95em; }
        .container { max-width: 900px; margin: -30px auto 40px auto; padding: 0 20px; }
        .card {
            background: var(--card-bg);
            padding: 25px 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            border: 1px solid var(--border-color);
            background: #fff;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: inherit;
        }
        .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        button.btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95em;
            font-family: inherit;
        }
        button.btn:hover { background: var(--primary-hover); }
        button.btn.secondary { background: #64748b; }
        .q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .q-no { font-weight: bold; color: var(--primary); }
        .tag { font-size: 0.75em; padding: 2px 8px; border-radius: 6px; background: #e0f2fe; color: #0284c7; font-weight: bold; }
        .tag.type { background: #f3e8ff; color: #9333ea; }
        .q-text { font-weight: 600; margin: 0 0 10px 0; white-space: pre-wrap; }
        pre.code {
            background: #0f172a;
            color: #e2e8f0;
            padding: 14px 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: Consolas, 'D2Coding', monospace;
            font-size: 0.9em;
            margin: 0 0 12px 0;
        }
        .opts { display: flex; flex-direction: column; gap: 8px; }
        .opts label {
            display: flex; gap: 8px; align-items: center;
            padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer;
        }
        .opts label:hover { background: #f1f5f9; }
        input[type=text] {
            width: 100%; box-sizing: border-box; padding: 12px;
            border: 1px solid var(--border-color); border-radius: 8px; font-size: 1em; font-family: inherit;
        }
        input[type=text]:focus { outline: none; border-color: var(--primary); }
        .result { margin-top: 12px; padding: 12px 14px; border-radius: 8px; font-size: 0.95em; display: none; }
        .result.ok { background: var(--ok-bg); color: #166534; display: block; }
        .result.ng { background: var(--ng-bg); color: #991b1b; display: block; }
        .result .exp { color: var(--text-color); margin-top: 6px; white-space: pre-wrap; }
        .actions { margin-top: 12px; display: flex; gap: 8px; }
        .score-box { text-align: center; font-size: 1.2em; font-weight: bold; }
        .score-box span { color: var(--primary); font-size: 1.5em; }
        .muted { color: #64748b; font-size: 0.85em; }
    </style>
</head>

    <div class="header-banner">

      exp: '미성년자 초상·개인정보 활용은 보호자 동의가 필요합니다.' },
    { cat: '수업 운영', type: 'choice', q: '학생이 코드 오류로 막혔을 때 강사의 바람직한 지도 방법은?',
      opts: ['정답 코드를 바로 알려준다', '오류 메시지·실행 결과를 함께 살펴보며 스스로 원인을 찾도록 질문한다', '다른 학생 코드를 복사하게 한다', '다음 차시로 넘어간다'], answer: 1,
      exp: '질문을 통해 디버깅 사고 과정을 길러주는 것이 목표입니다.' }
];

const state = { cat: '전체', order: [], answered: {}, picks: {} };
const cats = ['전체', ...Array.from(new Set(QUESTIONS.map(q => q.cat)))];
const $ = id => document.getElementById(id);

const norm = s => String(s).replace(/\s+/g, '').toLowerCase();

function initOrder() { state.order = QUESTIONS.map((_, i) => i); }

function shuffle() {
    for (let i = state.order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
    }
    render();
}

function renderChips() {
    const box = $('chips');
    box.innerHTML = '';
    cats.forEach(c => {
        const b = document.createElement('button');
        b.className = 'chip' + (c === state.cat ? ' active' : '');
        b.textContent = c;
        b.onclick = () => { state.cat = c; render(); };
        box.appendChild(b);
    });
}

function renderScore() {
    const ids = Object.keys(state.answered);
    const ok = ids.filter(i => state.answered[i]).length;
    $('scoreBox').innerHTML = `채점 ${ids.length} / ${QUESTIONS.length}문항 · 정답 <span>${ok}</span>개`;
}

function check(idx, card) {
    const q = QUESTIONS[idx];
    let correct = false;
    if (q.type === 'choice') {
        const sel = card.querySelector('input[type=radio]:checked');
        if (!sel) { alert('보기를 선택하세요.'); return; }
        correct = parseInt(sel.value, 10) === q.answer;
    } else {
        const v = card.querySelector('input[type=text]').value;
        if (!v.trim()) { alert('답을 입력하세요.'); return; }
        correct = q.answer.some(a => norm(a) === norm(v));
    }
    state.answered[idx] = correct;
    showResult(idx, card, correct);
    renderScore();
}

function showResult(idx, card, correct) {
    const q = QUESTIONS[idx];
    const ans = q.type === 'choice' ? `${q.answer + 1}번. ${q.opts[q.answer]}` : q.answer[0];
    const r = card.querySelector('.result');
    r.className = 'result ' + (correct ? 'ok' : 'ng');
    r.innerHTML = '';
    const head = document.createElement('strong');
    head.textContent = correct ? '정답입니다!' : '오답입니다. 정답: ' + ans;
    const exp = document.createElement('div');
    exp.className = 'exp';
    exp.textContent = q.exp;
    r.append(head, exp);
}

function render() {
    renderChips();
    const list = $('list');
    list.innerHTML = '';
    let n = 0;
    state.order.forEach(idx => {
        const q = QUESTIONS[idx];
        if (state.cat !== '전체' && q.cat !== state.cat) return;
        n++;
        const card = document.createElement('div');
        card.className = 'card';

        const head = document.createElement('div');
        head.className = 'q-head';
        head.innerHTML = '<span class="q-no"></span><span class="tag"></span><span class="tag type"></span>';
        head.children[0].textContent = `문제 ${n}`;
        head.children[1].textContent = q.cat;
        head.children[2].textContent = q.type === 'choice' ? '객관식' : '단답형';
        card.appendChild(head);

        if (q.code) {
            const pre = document.createElement('pre');
            pre.className = 'code';
            pre.textContent = q.code;
            card.appendChild(pre);
        }

        const p = document.createElement('p');
        p.className = 'q-text';
        p.textContent = q.q;
        card.appendChild(p);

        if (q.type === 'choice') {
            const opts = document.createElement('div');
            opts.className = 'opts';
            q.opts.forEach((o, i) => {
                const lab = document.createElement('label');
                const r = document.createElement('input');
                r.type = 'radio'; r.name = 'q' + idx; r.value = i;
                lab.append(r, document.createTextNode(`${i + 1}. ${o}`));
                opts.appendChild(lab);
            });
            card.appendChild(opts);
        } else {
            const t = document.createElement('input');
            t.type = 'text'; t.placeholder = '정답 입력';
            t.addEventListener('keydown', e => { if (e.key === 'Enter') check(idx, card); });
            card.appendChild(t);
        }

        const actions = document.createElement('div');
        actions.className = 'actions';
        const btn = document.createElement('button');
        btn.className = 'btn'; btn.textContent = '정답 확인';
        btn.onclick = () => check(idx, card);
        actions.appendChild(btn);
        card.appendChild(actions);

        const res = document.createElement('div');
        res.className = 'result';
        card.appendChild(res);

        list.appendChild(card);
    });
    renderScore();
}

$('shuffleBtn').onclick = shuffle;
$('resetBtn').onclick = () => { state.answered = {}; initOrder(); render(); };

initOrder();
render();
</script>
</body>
</html>
